name: go

# The smallest check that would have caught the folded entry name: the unit suite runs
# here, so a signing change cannot land on master with nothing having read its bytes.
# The suite does not need a jdk or an sdk, so this job needs nothing else either.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt clean:"
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # apkc no es un binario que corra solo: necesita un sdk y un jdk al lado. Aun asi
      # el codigo propio tiene que compilar en todo lo que pueda tener uno delante, y un
      # 0xCAFEBABE guardado en un int de 32 bits ya demostro que eso no se comprueba solo.
      - name: cross-compile
        run: |
          set -e
          for target in linux/amd64 linux/386 linux/arm64 linux/arm \
                        darwin/amd64 darwin/arm64 \
                        windows/amd64 windows/386 windows/arm64 \
                        freebsd/amd64 openbsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null .
            echo "ok $target"
          done
